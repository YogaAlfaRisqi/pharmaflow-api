version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pharmaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pharmaflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharmaflow_dev_password}
      POSTGRES_DB: ${DB_NAME:-pharmaflow_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-pharmaflow}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmaflow-network

networks:
  pharmaflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
